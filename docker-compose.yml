# Run with containerd:  nerdctl compose up -d   (build first with scripts/build-image.sh)
services:
  app:
    image: ${IMAGE:-school-website-cms:latest}
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://school:school@db:5432/school
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    volumes: ["appdata:/data"]
    depends_on: [db, redis]
  db:
    image: postgres:17
    environment: { POSTGRES_USER: school, POSTGRES_PASSWORD: school, POSTGRES_DB: school }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
volumes: { pgdata: {}, appdata: {} }
